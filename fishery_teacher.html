<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>등대말 어장 · 교사</title>
<style>
  :root{ --teal:#0e8c94; --amber:#f2a53c; --ok:#1d6b3a; --bad:#c0492f; }
  *{box-sizing:border-box;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic",sans-serif; margin:0; background:#eef4f5; color:#12333a;}
  .wrap{max-width:1000px; margin:0 auto; padding:20px 16px 60px;}
  h1{font-size:20px; margin:0 0 12px;}
  .card{background:#fff; border:1px solid #d5e4e6; border-radius:12px; padding:16px; margin-bottom:14px;}
  label{display:block; font-weight:700; font-size:13px; margin:8px 0 5px;}
  input,select{padding:9px; font-size:14px; border:1px solid #bcd3d6; border-radius:8px;} select{width:160px;}
  button{padding:10px 14px; font-size:14px; font-weight:700; border:none; border-radius:8px; cursor:pointer; color:#fff;}
  .amber{background:var(--amber); color:#3a2500;} .blue{background:#2f7cc4;} .gray{background:#6b7b88;} .green{background:#2f9e5e;}
  button:disabled{opacity:.45; cursor:default;}
  .cap-grid{display:flex; flex-wrap:wrap; gap:10px;}
  .cap-item{display:flex; align-items:center; gap:8px; background:#f2f8f8; padding:8px 10px; border-radius:8px;} .cap-item input{width:64px;}
  table{width:100%; border-collapse:collapse; font-size:14px; margin-top:8px;}
  th,td{border:1px solid #dfeaeb; padding:9px 8px; text-align:center;}
  th{background:#eef5f5;}
  .st-wait{color:#a06a00; font-weight:700;} .st-ready{color:#7a3ea8; font-weight:800;} .st-play{color:#0e6f8c; font-weight:800;} .st-done{color:#1d6b3a; font-weight:800;}
  .res-ok{color:var(--ok); font-weight:800;} .res-bad{color:var(--bad); font-weight:800;} .res-none{color:#9aa7b2;}
  .trend{font-variant-numeric:tabular-nums; font-size:13px;}
  .controls{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:8px;}
  .msg{margin-top:10px; padding:10px 12px; border-radius:8px; font-size:13.5px; display:none;}
  .msg.ok{background:#e7f5ec; border:1px solid #b6dfc4; color:#1d6b3a;}
  .msg.err{background:#fdecec; border:1px solid #f2b8b8; color:#a12626;}
  small.hint{color:#54727a; font-size:12.5px; display:block; margin-top:8px;}
  .avatar-cell{font-size:18px; letter-spacing:2px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>🎣 등대말 어장 · 교사용 진행판</h1>

  <div class="card">
    <label>웹 앱 URL (<code>.../exec</code>) — <b>어장용 배포 주소</b></label>
    <input type="text" id="url" style="width:100%;" placeholder="https://script.google.com/.../exec">
    <small class="hint">어장 학생 파일과 같은 URL을 씁니다(등대와는 다른 배포/시트).</small>
  </div>

  <div class="card">
    <div style="display:flex; gap:16px; align-items:flex-end; flex-wrap:wrap;">
      <div><label>세션(반)</label><select id="tSession" onchange="loadRoster()"><option>1반</option><option>2반</option><option>3반</option><option>4반</option><option>5반</option><option>6반</option><option>7반</option><option>8반</option><option>9반</option><option>10반</option></select></div>
    </div>
    <label>모둠별 정원 (0이면 미사용)</label>
    <div class="cap-grid" id="capEditor"></div>
    <button class="amber" style="margin-top:12px;" onclick="saveRoster()">정원 저장 (로비 초기화됨)</button>
    <div id="tMsg" class="msg"></div>
    <small class="hint">저장하면 이 반의 입장·진행 상태가 초기화됩니다. 수업 시작 전에 한 번만 누르세요.</small>
  </div>

  <div class="card">
    <div class="controls">
      <button class="amber" onclick="refresh()">🔄 새로고침</button>
      <button class="green" onclick="forceStartAll()">▶ 전체 시작 (1일차)</button>
      <button class="blue" onclick="nextRoundAll()">⏭ 전체 다음 일차</button>
      <button class="gray" onclick="resetLobby()">로비 초기화</button>
    </div>
    <table id="monitor"></table>
    <div id="cMsg" class="msg"></div>
    <small class="hint">🔄 <b>새로고침</b> 버튼을 누를 때만 갱신됩니다. 진행: "준비완료"가 되면 → <b>전체 시작</b>으로 1일차를 열고 → 각 모둠이 결과를 다 본 뒤 <b>전체 다음 일차</b>로 넘깁니다(기본 5일차). 어장 추이는 각 일차 <b>시작 시점</b> 물고기 수예요. 특정 모둠만 넘기려면 그 줄 버튼을 쓰세요.</small>
  </div>
</div>

<script>
  var GROUPS=['1모둠','2모둠','3모둠','4모둠','5모둠','6모둠'];
  var INIT_STOCK=100, MAX_PER=10, REGEN=0.5, CAP=100, ROUNDS=['어장1','어장2','어장3','어장4','어장5'];
  var urlInput=document.getElementById('url');
  try{ urlInput.value=localStorage.getItem('fish_url')||''; }catch(e){}
  function getUrl(){ var u=urlInput.value.trim(); if(u){try{localStorage.setItem('fish_url',u);}catch(e){}} return u; }
  function msg(id,t,ok){ var el=document.getElementById(id); el.style.display='block'; el.className='msg '+(ok?'ok':'err'); el.textContent=t; }

  async function post(action,payload){ var url=getUrl(); if(!url) throw new Error('URL을 입력하세요');
    var res=await fetch(url,{method:'POST',body:JSON.stringify(Object.assign({action:action},payload))}); return JSON.parse(await res.text()); }
  async function getQ(params){ var url=getUrl(); if(!url) throw new Error('URL을 입력하세요');
    var qs=Object.keys(params).map(function(k){return k+'='+encodeURIComponent(params[k]);}).join('&');
    var res=await fetch(url+(url.indexOf('?')>=0?'&':'?')+qs); return JSON.parse(await res.text()); }

  function buildCap(caps){
    var box=document.getElementById('capEditor'); box.innerHTML='';
    GROUPS.forEach(function(g,i){ var d=document.createElement('div'); d.className='cap-item';
      d.innerHTML='<span>'+g+'</span><input type="number" min="0" max="10" id="cap_'+i+'" value="'+((caps&&caps[g]!=null)?caps[g]:5)+'">';
      box.appendChild(d); });
  }
  async function loadRoster(){
    try{ var s=document.getElementById('tSession').value; var r=await getQ({action:'roster',session:s});
      var caps={}; (r.data||[]).forEach(function(x){caps[x.group]=x.capacity;}); buildCap(Object.keys(caps).length?caps:null);
    }catch(e){ buildCap(null); }
  }
  async function saveRoster(){
    try{ var s=document.getElementById('tSession').value;
      var roster=GROUPS.map(function(g,i){return {group:g,capacity:Number(document.getElementById('cap_'+i).value)||0};});
      var r=await post('saveRoster',{session:s,roster:roster});
      msg('tMsg', r.ok?'✅ 정원 저장 완료. 로비가 초기화됐습니다.':'⚠️ '+r.error, r.ok); if(r.ok) await refresh();
    }catch(e){ msg('tMsg','❌ '+e.message,false); }
  }
  async function forceStartAll(){ try{ await post('forceStart',{session:document.getElementById('tSession').value}); msg('cMsg','✅ 1일차를 시작했습니다.',true); await refresh();}catch(e){msg('cMsg','❌ '+e.message,false);} }
  async function nextRoundAll(){ try{ await post('nextRound',{session:document.getElementById('tSession').value}); msg('cMsg','✅ 다음 일차로 넘겼습니다.',true); await refresh();}catch(e){msg('cMsg','❌ '+e.message,false);} }
  async function nextRoundGroup(g){ try{ await post('nextRound',{session:document.getElementById('tSession').value,group:g}); await refresh();}catch(e){msg('cMsg','❌ '+e.message,false);} }
  async function startGroup(g){ try{ await post('forceStart',{session:document.getElementById('tSession').value,group:g}); await refresh();}catch(e){msg('cMsg','❌ '+e.message,false);} }
  async function resetLobby(){ try{ await post('resetLobby',{session:document.getElementById('tSession').value}); msg('cMsg','✅ 로비를 초기화했습니다.',true); await refresh();}catch(e){msg('cMsg','❌ '+e.message,false);} }

  /* 어장 진행 계산 */
  function clampH(v){ v=Math.floor(Number(v)||0); return Math.max(0,Math.min(MAX_PER,v)); }
  function groupProgression(rows){
    var byR={}; rows.forEach(function(d){ (byR[d.round]=byR[d.round]||[]).push(clampH(d.contribution)); });
    var s=INIT_STOCK, trend=[s], caughtTotal=0, played=0;
    for(var i=0;i<ROUNDS.length;i++){
      var reqs=byR[ROUNDS[i]]; if(!reqs) break;
      played++;
      var totalReq=reqs.reduce(function(a,b){return a+b;},0);
      var caught = s<=0 ? 0 : Math.min(totalReq, s);
      var remaining=Math.max(0,s-caught);
      var nextStock=Math.min(CAP, remaining+Math.floor(remaining*REGEN));
      caughtTotal+=caught; s=nextStock; trend.push(s);
    }
    return {trend:trend, caughtTotal:caughtTotal, finalStock:s, played:played};
  }

  var timer=null;
  async function refresh(){
    var session=document.getElementById('tSession').value;
    var rosterRes, resp;
    try{ rosterRes=await getQ({action:'roster',session:session}); }catch(e){ return; }
    try{ resp=await getQ({session:session}); }catch(e){ resp={data:[]}; }
    var groups=(rosterRes.data||[]).map(function(x){return x.group;});
    var capMap={}; (rosterRes.data||[]).forEach(function(x){capMap[x.group]=Number(x.capacity)||0;});
    var rowsByGroup={}; (resp.data||[]).forEach(function(d){ (rowsByGroup[d.group]=rowsByGroup[d.group]||[]).push(d); });

    var table=document.getElementById('monitor');
    table.innerHTML='<tr><th>모둠</th><th>입장/정원</th><th>아바타</th><th>진행</th><th>어장 추이(일차 시작)</th><th>누적 어획</th><th>상태</th><th>컨트롤</th></tr>';
    for(var gi=0; gi<groups.length; gi++){
      var g=groups[gi];
      var st; try{ st=await getQ({action:'lobby',session:session,group:g}); }catch(e){ continue; }
      var cap=capMap[g]||0, phase=st.phase||'waiting', round=st.round||'';
      var dayN=ROUNDS.indexOf(round)>=0?(ROUNDS.indexOf(round)+1)+'일차':round;
      var stTxt = phase==='waiting'?'<span class="st-wait">대기</span>'
                : phase==='ready'?'<span class="st-ready">준비완료</span>'
                : phase==='done'?'<span class="st-done">완료</span>'
                : '<span class="st-play">'+dayN+' 진행</span>';
      var prog=groupProgression(rowsByGroup[g]||[]);
      var trendTxt = prog.played? '<span class="trend">'+prog.trend.join(' → ')+'</span>' : '<span class="res-none">–</span>';
      var caughtTxt = prog.played? prog.caughtTotal+'마리' : '<span class="res-none">–</span>';
      var stateTxt = !prog.played? '<span class="res-none">–</span>'
                   : (prog.finalStock<=0? '<span class="res-bad">🪸 붕괴</span>' : '<span class="res-ok">🐟 유지</span>');
      var ctrl;
      if(phase==='waiting'||phase==='ready') ctrl='<button class="green" onclick="startGroup(\''+g+'\')">시작</button>';
      else if(phase==='done') ctrl='<button class="gray" disabled>종료</button>';
      else ctrl='<button class="blue" onclick="nextRoundGroup(\''+g+'\')">다음 일차</button>';

      var tr=document.createElement('tr');
      tr.innerHTML='<td>'+g+'</td><td>'+st.count+' / '+cap+'</td>'
        +'<td class="avatar-cell">'+(st.avatars||[]).join(' ')+'</td>'
        +'<td>'+stTxt+'</td><td>'+trendTxt+'</td><td>'+caughtTxt+'</td><td>'+stateTxt+'</td><td>'+ctrl+'</td>';
      table.appendChild(tr);
    }
  }

  buildCap(null);
  refresh();
</script>
</body>
</html>
